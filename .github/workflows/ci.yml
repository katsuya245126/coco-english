name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run, so three quick
# pushes cost one run instead of three.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholder values only — never real credentials. Every env read in
    # src/ is lazy (`process.env.X?.trim() ?? ""` inside functions, not at
    # module load), so these just need to exist and be well-formed. The
    # Supabase URL must parse as a URL; the rest are opaque strings.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      OPENAI_API_KEY: placeholder-openai-key
      AZURE_SPEECH_KEY: placeholder-azure-key
      AZURE_SPEECH_REGION: koreacentral
      PIN_HASH_PEPPER: placeholder-pepper
      STUDENT_AUDIO_BUCKET: student-audio
      CRON_SECRET: placeholder-cron-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the local Node major version; 20.19.0 is the floor set by
          # the "engines" field in package.json.
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `npm test` is `vitest` in watch mode, which never exits on CI — so the
      # runner is invoked directly with `run`.
      #
      # The four excluded specs open real connections to Supabase and fail with
      # `fetch failed` against the placeholder URL above. They are not broken;
      # they need credentials this workflow deliberately does not carry. Run
      # them locally against a real project:
      #   npx vitest run tests/server/foundation-smoke.test.ts …
      - name: Unit tests
        run: |
          npx vitest run --reporter=dot \
            --exclude "tests/server/foundation-smoke.test.ts" \
            --exclude "tests/server/remembered-class-resolve.test.ts" \
            --exclude "tests/server/student-access.test.ts" \
            --exclude "tests/server/teacher-ownership.test.ts"

      # Also runs `postbuild`, which asserts the ffmpeg-static binary is traced
      # into the student audio route. That guard protects against a silent
      # production regression, and Linux here matches the deploy target more
      # closely than macOS does locally.
      - name: Build
        run: npm run build
