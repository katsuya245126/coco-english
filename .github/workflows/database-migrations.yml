name: Database migrations

on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/**
  workflow_dispatch:

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.107.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: supabase db push --linked --yes

  # Public demo project (separate Supabase). Skips until the Demo environment
  # has DEMO_SUPABASE_PROJECT_REF, so main stays green before it exists.
  migrate-demo:
    runs-on: ubuntu-latest
    environment: Demo
    timeout-minutes: 15
    concurrency:
      group: demo-database-migrations
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEMO_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.DEMO_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_PROJECT_REF != ''

      - uses: supabase/setup-cli@v3
        if: env.SUPABASE_PROJECT_REF != ''
        with:
          version: 2.107.0

      - name: Link Supabase project
        if: env.SUPABASE_PROJECT_REF != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        if: env.SUPABASE_PROJECT_REF != ''
        run: supabase db push --linked --yes
